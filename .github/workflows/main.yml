name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - feature/docker-ci

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/billing-bee:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/billing-bee:latest